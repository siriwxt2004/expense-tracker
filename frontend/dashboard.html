<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมุดบัญชี — ภาพรวม</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar__brand">สมุดบัญชี</div>
      <nav class="sidebar__nav">
        <span class="sidebar__user" id="current-username">—</span>
      </nav>
      <button id="logout-btn" class="btn btn-ghost sidebar__logout">ออกจากระบบ</button>
    </aside>

    <!-- Main content -->
    <main class="main">

      <header class="main__header">
        <h1>ภาพรวมบัญชี</h1>
        <p class="main__date-today" id="today-date"></p>
      </header>

      <!-- สรุปยอด -->
      <section class="summary-row">
        <div class="summary-tile">
          <span class="summary-tile__label">รายรับรวม</span>
          <span class="summary-tile__value summary-tile__value--income" id="summary-income">฿0.00</span>
        </div>
        <div class="summary-tile">
          <span class="summary-tile__label">รายจ่ายรวม</span>
          <span class="summary-tile__value summary-tile__value--expense" id="summary-expense">฿0.00</span>
        </div>
        <div class="summary-tile summary-tile--balance">
          <span class="summary-tile__label">คงเหลือ</span>
          <span class="summary-tile__value" id="summary-balance">฿0.00</span>
        </div>
      </section>

      <div class="content-grid">

        <!-- ฟอร์มเพิ่ม/แก้ไขรายการ + ตัวกรอง -->
        <section class="panel">
          <h2 class="panel__title" id="form-title">เพิ่มรายการ</h2>
          <form id="transaction-form" class="tx-form">
            <input type="hidden" id="tx-id">
            <div class="tx-form__row">
              <label class="field">
                <span>ประเภท</span>
                <select id="tx-type" required>
                  <option value="income">รายรับ</option>
                  <option value="expense">รายจ่าย</option>
                </select>
              </label>
              <label class="field">
                <span>จำนวนเงิน (บาท)</span>
                <input type="number" id="tx-amount" step="0.01" min="0.01" required>
              </label>
            </div>
            <div class="tx-form__row">
              <label class="field">
                <span>หมวดหมู่</span>
                <input type="text" id="tx-category" list="category-options" required placeholder="เช่น อาหาร, เงินเดือน">
                <datalist id="category-options"></datalist>
              </label>
              <label class="field">
                <span>วันที่</span>
                <input type="date" id="tx-date" required>
              </label>
            </div>
            <label class="field">
              <span>โน้ต (ไม่บังคับ)</span>
              <input type="text" id="tx-note" maxlength="255" placeholder="รายละเอียดเพิ่มเติม">
            </label>
            <div class="tx-form__actions">
              <button type="submit" class="btn btn-primary" id="tx-submit-btn">บันทึกรายการ</button>
              <button type="button" class="btn btn-ghost" id="tx-cancel-btn" hidden>ยกเลิกการแก้ไข</button>
            </div>
          </form>

          <hr class="divider">

          <h2 class="panel__title">กรองรายการ</h2>
          <div class="filters">
            <label class="field">
              <span>ตั้งแต่วันที่</span>
              <input type="date" id="filter-start">
            </label>
            <label class="field">
              <span>ถึงวันที่</span>
              <input type="date" id="filter-end">
            </label>
            <label class="field">
              <span>ประเภท</span>
              <select id="filter-type">
                <option value="">ทั้งหมด</option>
                <option value="income">รายรับ</option>
                <option value="expense">รายจ่าย</option>
              </select>
            </label>
            <label class="field">
              <span>หมวดหมู่</span>
              <select id="filter-category">
                <option value="">ทั้งหมด</option>
              </select>
            </label>
            <div class="filters__actions">
              <button type="button" class="btn btn-primary" id="apply-filter-btn">กรองข้อมูล</button>
              <button type="button" class="btn btn-ghost" id="reset-filter-btn">ล้างตัวกรอง</button>
            </div>
          </div>
        </section>

        <!-- กราฟและตาราง -->
        <section class="panel">
          <h2 class="panel__title">รายจ่ายแยกตามหมวดหมู่</h2>
          <div class="chart-wrap">
            <canvas id="category-chart" width="360" height="280"></canvas>
            <p class="chart-empty" id="chart-empty" hidden>ยังไม่มีข้อมูลรายจ่ายในช่วงนี้</p>
          </div>
        </section>

      </div>

      <!-- ตารางรายการ -->
      <section class="panel panel--wide">
        <h2 class="panel__title">รายการทั้งหมด</h2>
        <div class="table-wrap">
          <table class="ledger-table">
            <thead>
              <tr>
                <th>วันที่</th>
                <th>ประเภท</th>
                <th>หมวดหมู่</th>
                <th>โน้ต</th>
                <th class="align-right">จำนวนเงิน</th>
                <th class="align-right">จัดการ</th>
              </tr>
            </thead>
            <tbody id="transactions-body">
              <!-- แถวข้อมูลจะถูกเติมด้วย JavaScript -->
            </tbody>
          </table>
          <p class="table-empty" id="table-empty" hidden>ยังไม่มีรายการ ลองเพิ่มรายการแรกของคุณดูสิ</p>
        </div>
      </section>

    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
