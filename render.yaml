services:
  - type: web
    name: expense-tracker
    runtime: node
    buildCommand: npm install --prefix backend
    startCommand: node backend/server.js
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: expense_tracker
      - key: DB_PORT
        value: "4000"
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        sync: false